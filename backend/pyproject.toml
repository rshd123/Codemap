[project]
name = "codemap-ai-engine"
version = "0.1.0"
description = "AI & Data Ingestion microservice for CodeMap"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "neo4j>=5.27",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.scripts]
codemap-ai = "app.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
